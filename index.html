<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frogg3r</title>
    <style>
      :root {
        color-scheme: dark;
        --font-display: Georgia, 'Times New Roman', serif;
        --font-body: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
        --font-mono:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        --surface-strong: rgba(9, 23, 18, 0.9);
        --surface-line: rgba(207, 242, 194, 0.18);
        --text-strong: #f5f9e7;
        --text-soft: rgba(225, 241, 211, 0.78);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        font-family: var(--font-body);
        background:
          radial-gradient(
            circle at 12% 8%,
            rgba(111, 155, 83, 0.25),
            transparent 30%
          ),
          radial-gradient(
            circle at 86% 48%,
            rgba(56, 112, 94, 0.22),
            transparent 32%
          ),
          linear-gradient(180deg, #13241d 0%, #0b1411 100%);
        color: var(--text-strong);
      }

      #app {
        min-height: 100dvh;
      }

      #lobby {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 16px;
      }

      #lobby-panel {
        width: min(100%, 472px);
        padding: 30px;
        border: 1px solid var(--surface-line);
        border-radius: 28px;
        background: linear-gradient(
          180deg,
          rgba(12, 31, 24, 0.95),
          rgba(8, 20, 17, 0.95)
        );
        box-shadow: 0 28px 70px rgba(2, 11, 8, 0.46);
        backdrop-filter: blur(14px);
      }

      #lobby-panel h1 {
        margin: 0 0 10px;
        color: var(--text-strong);
        font-family: var(--font-display);
        font-size: clamp(2.5rem, 7vw, 3.55rem);
        line-height: 0.92;
        letter-spacing: -0.055em;
        text-wrap: balance;
      }

      #lobby-subtitle {
        max-width: 34ch;
        margin: 0 0 24px;
        color: var(--text-soft);
        font-size: 1rem;
        line-height: 1.55;
        text-wrap: pretty;
      }

      .invite-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
      }

      #invite-code {
        width: 100%;
        min-width: 0;
        padding: 13px 14px;
        border: 1px solid rgba(186, 238, 171, 0.2);
        border-radius: 14px;
        outline: none;
        background: rgba(243, 252, 233, 0.07);
        color: #f3fbe8;
        font-family: var(--font-mono);
        font-size: 0.94rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        transition:
          border-color 180ms ease,
          background 180ms ease,
          box-shadow 180ms ease;
      }

      #invite-code:focus {
        border-color: rgba(188, 232, 175, 0.45);
        background: rgba(243, 252, 233, 0.11);
        box-shadow: 0 0 0 4px rgba(112, 190, 90, 0.14);
      }

      .lobby-action {
        padding: 12px 14px;
        border: 1px solid rgba(208, 241, 198, 0.18);
        border-radius: 14px;
        background: rgba(30, 70, 52, 0.92);
        color: #eff7df;
        font-family: var(--font-body);
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: -0.01em;
        cursor: pointer;
        transition:
          transform 180ms ease,
          background 180ms ease,
          border-color 180ms ease,
          box-shadow 180ms ease;
      }

      .lobby-action:hover:not(:disabled) {
        transform: translateY(-1px);
        background: rgba(43, 91, 68, 0.96);
        border-color: rgba(208, 241, 198, 0.3);
        box-shadow: 0 12px 24px rgba(2, 11, 8, 0.32);
      }

      .lobby-action:active:not(:disabled) {
        transform: translateY(1px) scale(0.99);
      }

      .lobby-action:focus-visible {
        outline: none;
        box-shadow: 0 0 0 4px rgba(112, 190, 90, 0.16);
      }

      .lobby-action:disabled {
        cursor: default;
        opacity: 0.58;
      }

      .lobby-action.compact {
        width: auto;
        padding-inline: 12px;
        font-size: 0.84rem;
      }

      .action-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-top: 12px;
      }

      #lobby-status {
        min-height: 48px;
        margin: 16px 0 0;
        padding-top: 16px;
        border-top: 1px solid rgba(208, 241, 198, 0.1);
        color: rgba(216, 237, 207, 0.92);
        font-size: 0.95rem;
        line-height: 1.55;
        text-wrap: pretty;
      }

      #game-root {
        position: relative;
        min-height: 100dvh;
        display: none;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        isolation: isolate;
        background:
          radial-gradient(
            circle at 50% 105%,
            rgba(83, 124, 66, 0.24),
            transparent 36%
          ),
          linear-gradient(180deg, #101a17 0%, #07100e 100%);
      }

      #game-root::after {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        content: '';
        background:
          linear-gradient(
            90deg,
            rgba(4, 9, 7, 0.34),
            transparent 18%,
            transparent 82%,
            rgba(4, 9, 7, 0.34)
          ),
          linear-gradient(
            180deg,
            rgba(4, 9, 7, 0.16),
            transparent 28%,
            rgba(4, 9, 7, 0.22)
          );
      }

      #game-root canvas {
        display: block;
        z-index: 0;
        box-shadow: 0 0 0 1px rgba(207, 242, 194, 0.08);
      }

      #copy-invite-ingame {
        position: static;
        min-width: 0;
      }

      #room-controls,
      #player-hud,
      #reset-notice,
      #game-status {
        z-index: 2;
        border: 1px solid var(--surface-line);
        background: linear-gradient(
          180deg,
          var(--surface-strong),
          rgba(8, 18, 15, 0.76)
        );
        box-shadow: 0 22px 58px rgba(2, 11, 8, 0.36);
        backdrop-filter: blur(16px);
      }

      #room-controls {
        position: absolute;
        top: 16px;
        left: 16px;
        padding: 13px;
        border-radius: 18px;
      }

      #player-hud {
        position: absolute;
        left: 50%;
        top: 16px;
        width: min(280px, calc(100vw - 32px));
        padding: 8px 12px 9px;
        border-radius: 16px;
        transform: translateX(-50%);
        text-align: center;
      }

      .player-name-input {
        width: 100%;
        margin: 0 0 7px;
        padding: 8px 10px;
        border: 1px solid rgba(186, 238, 171, 0.24);
        border-radius: 12px;
        outline: none;
        background: rgba(243, 252, 233, 0.08);
        color: #f3fbe8;
        font-family: var(--font-body);
        font-size: 0.88rem;
        font-weight: 800;
        text-align: center;
        transition:
          border-color 180ms ease,
          background 180ms ease,
          box-shadow 180ms ease;
      }

      .player-name-input:focus {
        background: rgba(243, 252, 233, 0.12);
        box-shadow: 0 0 0 4px rgba(112, 190, 90, 0.14);
      }

      .player-role-label {
        display: block;
        color: rgba(222, 241, 209, 0.72);
        font-family: var(--font-mono);
        font-size: 0.58rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .player-role-value {
        display: block;
        margin-top: 2px;
        color: var(--text-strong);
        font-family: var(--font-display);
        font-size: clamp(1.12rem, 2.4vw, 1.55rem);
        line-height: 0.95;
        letter-spacing: -0.04em;
        text-transform: capitalize;
        text-wrap: balance;
      }

      #player-control-hint {
        max-width: 32ch;
        margin: 4px auto 0;
        color: rgba(232, 244, 219, 0.84);
        font-size: 0.72rem;
        line-height: 1.25;
        text-wrap: pretty;
      }

      #reset-notice {
        position: absolute;
        left: 50%;
        top: 50%;
        width: min(420px, calc(100vw - 32px));
        padding: 18px 22px;
        border-radius: 22px;
        color: #f6ffe9;
        font-family: var(--font-display);
        font-size: clamp(1.2rem, 3vw, 2rem);
        line-height: 1.05;
        letter-spacing: -0.04em;
        text-align: center;
        text-wrap: balance;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      #reset-notice[hidden] {
        display: none;
      }

      .room-label,
      .level-label {
        display: block;
        color: rgba(222, 241, 209, 0.72);
        font-family: var(--font-mono);
        font-size: 0.68rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .room-value {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: fit-content;
        min-height: 38px;
        padding: 0 10px;
        border: 1px solid rgba(186, 238, 171, 0.16);
        border-radius: 13px;
        background: rgba(243, 252, 233, 0.08);
        color: #f3fbe8;
        font-family: var(--font-mono);
        font-size: 0.92rem;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.14em;
      }

      .room-copy-row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 7px;
      }

      .room-copy-row .compact {
        min-width: 96px;
      }

      .level-select {
        width: 156px;
        padding: 11px 12px;
        border: 1px solid rgba(186, 238, 171, 0.16);
        border-radius: 14px;
        outline: none;
        background: rgba(243, 252, 233, 0.08);
        color: #f3fbe8;
        color-scheme: dark;
        font-family: var(--font-body);
        font-weight: 700;
        transition:
          border-color 180ms ease,
          background 180ms ease,
          box-shadow 180ms ease;
      }

      .level-select option {
        background: #0b1813;
        color: #f3fbe8;
      }

      .level-select:focus-visible {
        border-color: rgba(188, 232, 175, 0.45);
        background: rgba(243, 252, 233, 0.11);
        box-shadow: 0 0 0 4px rgba(112, 190, 90, 0.14);
      }

      #game-status {
        position: absolute;
        top: 16px;
        right: 16px;
        width: auto;
        border-radius: 18px;
        color: var(--text-strong);
      }

      #game-status[open] {
        width: min(316px, calc(100vw - 32px));
      }

      #game-status summary {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        min-width: 52px;
        min-height: 42px;
        padding: 0 10px;
        color: rgba(232, 244, 219, 0.9);
        font-family: var(--font-mono);
        font-size: 1rem;
        cursor: pointer;
        list-style: none;
      }

      #game-status summary::-webkit-details-marker {
        display: none;
      }

      #game-status summary::after {
        width: 7px;
        height: 7px;
        border-right: 2px solid currentColor;
        border-bottom: 2px solid currentColor;
        content: '';
        opacity: 0.7;
        transform: translateY(-2px) rotate(45deg);
        transition: transform 160ms ease;
      }

      #game-status[open] summary::after {
        transform: translateY(2px) rotate(225deg);
      }

      #game-status summary:focus-visible {
        outline: none;
        box-shadow: 0 0 0 4px rgba(112, 190, 90, 0.14);
      }

      .status-panel-body {
        padding: 0 12px 12px;
      }

      .status-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .status-item {
        padding: 9px 10px;
        border: 1px solid rgba(186, 238, 171, 0.12);
        border-radius: 12px;
        background: rgba(243, 252, 233, 0.08);
      }

      .status-item-wide {
        margin-top: 8px;
      }

      .status-item-large {
        margin-top: 8px;
        min-height: 76px;
      }

      .status-label {
        display: block;
        margin-bottom: 5px;
        color: rgba(222, 241, 209, 0.68);
        font-family: var(--font-mono);
        font-size: 0.66rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .status-value {
        display: block;
        color: #f3fbe8;
        font-family: var(--font-mono);
        font-size: 0.8rem;
        font-variant-numeric: tabular-nums;
        line-height: 1.35;
        text-wrap: pretty;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <section id="lobby">
        <div id="lobby-panel">
          <h1>Frogg3r</h1>
          <p id="lobby-subtitle">
            Share one frog. Split the jump. Rotate roles after every landing.
          </p>
          <div class="invite-row">
            <input
              id="invite-code"
              type="text"
              placeholder="Invite code"
              autocomplete="off"
            />
            <button
              id="copy-invite"
              class="lobby-action compact"
              type="button"
              hidden
            >
              📋
            </button>
          </div>
          <div class="action-row">
            <button id="create-game" class="lobby-action" type="button">
              Create Game
            </button>
            <button id="join-game" class="lobby-action" type="button">
              Join Game
            </button>
          </div>
          <p id="lobby-status">Ready</p>
        </div>
      </section>

      <div id="game-root">
        <aside id="room-controls" aria-label="Room controls">
          <span class="room-label">Room</span>
          <div class="room-copy-row">
            <span id="room-code" class="room-value">------</span>
            <button
              id="copy-invite-ingame"
              class="lobby-action compact"
              type="button"
            >
              📋
            </button>
            <select
              id="level-select"
              class="level-select"
              aria-label="Level"
            ></select>
          </div>
        </aside>

        <section id="player-hud" aria-live="polite">
          <label class="player-role-label" for="player-name-input">
            Your name
          </label>
          <input
            id="player-name-input"
            class="player-name-input"
            type="text"
            maxlength="18"
            autocomplete="nickname"
          />
          <span class="player-role-label">Now you handle</span>
          <span id="player-role-value" class="player-role-value"
            >Spectator</span
          >
          <p id="player-control-hint">Waiting for a player role.</p>
        </section>

        <p id="reset-notice" aria-live="assertive" hidden></p>

        <details id="game-status">
          <summary aria-label="Match details">ℹ️</summary>
          <div class="status-panel-body">
            <div class="status-grid">
              <div class="status-item">
                <span class="status-label">Players</span>
                <span id="status-players" class="status-value">-</span>
              </div>
              <div class="status-item">
                <span class="status-label">You</span>
                <span id="status-player" class="status-value">-</span>
              </div>
              <div class="status-item">
                <span class="status-label">Creator</span>
                <span id="status-creator" class="status-value">-</span>
              </div>
              <div class="status-item">
                <span class="status-label">Level</span>
                <span id="status-level" class="status-value">-</span>
              </div>
              <div class="status-item">
                <span class="status-label">Phase</span>
                <span id="status-phase" class="status-value">-</span>
              </div>
              <div class="status-item">
                <span class="status-label">Jumps</span>
                <span id="status-jumps" class="status-value">-</span>
              </div>
              <div class="status-item">
                <span class="status-label">Power</span>
                <span id="status-power" class="status-value">-</span>
              </div>
              <div class="status-item">
                <span class="status-label">Mid-air</span>
                <span id="status-midair" class="status-value">-</span>
              </div>
            </div>
            <div class="status-item status-item-wide">
              <span class="status-label">Roles</span>
              <span id="status-roles" class="status-value">-</span>
            </div>
            <div class="status-item status-item-large">
              <span class="status-label">Controls</span>
              <span id="status-controls" class="status-value">
                Your visible hint changes with your current role.
              </span>
            </div>
          </div>
        </details>
      </div>
    </div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
